---
deployment:
  tasks:
    - export DEST=$HOME/public_html/watch
    - /bin/mkdir -p $DEST
    - /bin/cp site/viewer.js site/api.php $DEST/
    - /bin/cp recorder/web/chart.js recorder/web/style.css $DEST/
    # Cloudflare caches scripts for hours; a new version stamp makes viewers load the new files.
    - /bin/sed "s/__V__/$(date +%s)/g" site/index.html > $DEST/index.html
