# Push to main → the live site updates.
#
# Asks cPanel to pull the latest main into its copy of this repository, then
# runs "Deploy HEAD Commit", which follows .cpanel.yml. Nothing deploys from
# other branches, so merging a pull request is the "go live" button.
#
# Repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   CPANEL_HOST       host and port of cPanel, e.g. grantgsolutions.com:2083
#   CPANEL_USER       the cPanel username
#   CPANEL_TOKEN      a cPanel API token (cPanel → Security → Manage API Tokens)
#   CPANEL_REPO_PATH  the repository path shown in cPanel → Git Version Control,
#                     e.g. /home/<user>/repositories/hydro-recorder
name: Deploy to website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull and deploy on cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_REPO_PATH: ${{ secrets.CPANEL_REPO_PATH }}
        run: |
          set -euo pipefail
          for name in CPANEL_HOST CPANEL_USER CPANEL_TOKEN CPANEL_REPO_PATH; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set."; exit 1; fi
          done
          # Call a cPanel UAPI function and stop with its error message if it fails.
          uapi() {
            local fn="$1"; shift
            local response
            response=$(curl -sS --fail-with-body --max-time 120 -G \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              --data-urlencode "repository_root=${CPANEL_REPO_PATH}" "$@" \
              "https://${CPANEL_HOST}/execute/${fn}")
            if [ "$(jq -r '.status' <<<"$response")" != "1" ]; then
              echo "::error::${fn} failed: $(jq -c '.errors' <<<"$response")"
              exit 1
            fi
            echo "$response" | jq -c '{status, messages, warnings}'
          }
          echo "Pulling main into cPanel's copy of the repository…"
          uapi VersionControl/update --data-urlencode "branch=main"
          echo "Deploying (runs .cpanel.yml)…"
          uapi VersionControlDeployment/create
          echo "Deployment of ${GITHUB_SHA::7} started; cPanel runs it in the background (about a minute)."
